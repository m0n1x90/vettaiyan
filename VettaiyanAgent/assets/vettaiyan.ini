; ============================================================
; VettaiyanEDR Agent Configuration
; ============================================================
; Place this file next to VettaiyanAgent.exe
; All settings are optional -- defaults are used if omitted.
;
; Changes take effect on service restart.
; ============================================================

[Shipper]
; Cloud backend URL for raw telemetry events.
; Leave empty to disable shipping (events stay local only).
;
; Examples:
;   Elasticsearch:  https://elk.corp.com:9200/vettaiyan-events/_bulk
;   Splunk HEC:     https://splunk.corp.com:8088/services/collector/raw
;   Custom:         https://siem.internal:443/api/v1/ingest
;
Endpoint=http://192.168.1.8:9200/vettaiyan-events/_bulk

; Index name (Elasticsearch) or HEC token (Splunk).
; For Elasticsearch _bulk API, this is the default index.
; For Splunk, this is the HEC token UUID.
;
IndexOrToken=vettaiyan-events

; HTTP authorization header sent with every POST.
; Format: "HeaderName: Value"
;
; Examples:
;   Elasticsearch:  Authorization: ApiKey base64encodedkey
;   Splunk HEC:     Splunk your-hec-token-here
;   Bearer token:   Authorization: Bearer eyJhbGciOiJIUzI1NiIs...
;
AuthHeader=

; Max events per HTTP POST batch (default: 500)
BatchSize=500

; How often the shipper wakes to flush events, in milliseconds (default: 2000)
FlushIntervalMs=2000

; Max events held in the in-memory transit buffer (default: 50000)
; When full, oldest events are dropped to make room.
MaxBufferSize=50000
